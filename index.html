<script>
let currentMode='single', batchFiles=[], batchResults=[]

function setMode(m,btn){
  currentMode=m
  document.querySelectorAll('.mode-panel').forEach(p=>p.classList.remove('active'))
  document.getElementById('mode-'+m).classList.add('active')
  document.querySelectorAll('.et').forEach(t=>t.classList.remove('active')); btn.classList.add('active')
}

// -- SINGLE OCR ---------------------------------------------
async function handleSingle(file){
  if(!file||!file.type.startsWith('image/')) { showErr('single-err','Please upload an image file'); return }
  const imgSrc=URL.createObjectURL(file)
  document.getElementById('single-preview').src=imgSrc
  document.getElementById('single-dz').style.display='none'
  document.getElementById('single-result').style.display='none'
  document.getElementById('single-prog').style.display='block'
  document.getElementById('single-err').style.display='none'
  try {
    const text=await runOCR(file,'single-fill','single-msg')
    document.getElementById('single-out').value=text
    const words=text.trim().split(/\s+/).filter(Boolean)
    document.getElementById('single-title').textContent=`? Extracted ${words.length} words`
    document.getElementById('sw').textContent=words.length
    document.getElementById('sc').textContent=text.length
    document.getElementById('sl').textContent=text.split('\n').filter(l=>l.trim()).length
    document.getElementById('slang').textContent=document.getElementById('lang').value
    document.getElementById('single-prog').style.display='none'
    document.getElementById('single-result').style.display='block'
  } catch(e){
    document.getElementById('single-prog').style.display='none'
    document.getElementById('single-dz').style.display='flex'
    showErr('single-err',e.message||'OCR failed')
  }
}

async function runOCR(source, fillId, msgId){
  // Load Tesseract.js as UMD script (not ESM � ESM path is unreliable on CDN)
  if(!window.Tesseract){
    await new Promise(function(resolve,reject){
      var s=document.createElement('script')
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js'
      s.onload=resolve
      s.onerror=function(){reject(new Error('Could not load Tesseract.js'))}
      document.head.appendChild(s)
    })
  }
  var createWorker=window.Tesseract.createWorker
  var lang=document.getElementById('lang').value
  var worker=await createWorker(lang,1,{
    logger:function(m){
      if(m.status==='recognizing text'){
        var pct=Math.round(m.progress*100)
        document.getElementById(msgId).textContent='Recognising� '+pct+'%'
        document.getElementById(fillId).style.width=pct+'%'
      } else { document.getElementById(msgId).textContent=m.status }
    }
  })
  var result=await worker.recognize(source)
  await worker.terminate()
  document.getElementById('sconf').textContent=result.data.confidence?result.data.confidence.toFixed(1)+'%':'�'
  return result.data.text
}

// -- BATCH OCR ----------------------------------------------
function handleBatch(files){
  batchFiles=[...batchFiles,...Array.from(files)]
  renderBatchList()
  document.getElementById('batch-actions').style.display='flex'
}

function renderBatchList(){
  document.getElementById('batch-list').innerHTML=batchFiles.map((f,i)=>`
    <div class="batch-item" id="bi-${i}">
      <span class="batch-icon">${f.type.startsWith('image/')?'???':'??'}</span>
      <span class="batch-name">${f.name} (${(f.size/1024).toFixed(0)} KB)</span>
      <span class="batch-status st-pending" id="bs-${i}">Pending</span>
      <button onclick="removeBatchItem(${i})" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:.8rem;margin-left:.3rem">?</button>
    </div>`).join('')
}

function removeBatchItem(i){ batchFiles.splice(i,1); batchResults.splice(i,1); renderBatchList() }
function clearBatch(){ batchFiles=[]; batchResults=[]; renderBatchList(); document.getElementById('batch-combined').style.display='none'; document.getElementById('batch-actions').style.display='none' }

async function runBatch(){
  batchResults=[]
  for(let i=0;i<batchFiles.length;i++){
    const bs=document.getElementById('bs-'+i)
    bs.className='batch-status st-processing'; bs.textContent='Processing�'
    try {
      const text=await runOCR(batchFiles[i],'single-fill','single-msg')
      batchResults[i]=text
      bs.className='batch-status st-done'; bs.textContent='Done ?'
    } catch(e){
      batchResults[i]=''
      bs.className='batch-status st-err'; bs.textContent='Error'
    }
  }
  const combined=batchFiles.map((f,i)=>`=== ${f.name} ===\n${batchResults[i]||'(failed)'}`).join('\n\n')
  document.getElementById('batch-out').value=combined
  document.getElementById('batch-combined').style.display='block'
  toast(`Batch complete: ${batchFiles.length} files`,'ok')
}

function downloadAllTXT(){
  const combined=batchFiles.map((f,i)=>`=== ${f.name} ===\n${batchResults[i]||'(not processed)'}`).join('\n\n')
  downloadText(combined,'batch-ocr-results.txt')
}

// -- PDF OCR ------------------------------------------------
async function handlePDF(file){
  if(!file||file.type!=='application/pdf'){toast('Please select a PDF file','err');return}
  document.getElementById('pdf-dz').style.display='none'
  document.getElementById('pdf-prog').style.display='block'
  document.getElementById('pdf-result').style.display='none'
  try {
    const {getDocument,GlobalWorkerOptions}=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs')
    GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs'
    const buf=await file.arrayBuffer()
    const pdf=await getDocument({data:buf}).promise
    let allText=''
    for(let p=1;p<=pdf.numPages;p++){
      document.getElementById('pdf-msg').textContent=`OCR page ${p}/${pdf.numPages}�`
      document.getElementById('pdf-fill').style.width=Math.round(p/pdf.numPages*100)+'%'
      const page=await pdf.getPage(p)
      const vp=page.getViewport({scale:2})
      const canvas=document.createElement('canvas')
      canvas.width=vp.width; canvas.height=vp.height
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise
      const text=await runOCR(canvas,'pdf-fill','pdf-msg')
      allText+=`--- Page ${p} ---\n${text}\n\n`
    }
    document.getElementById('pdf-out').value=allText
    document.getElementById('pdf-title').textContent=`? Extracted from ${pdf.numPages} pages`
    document.getElementById('pdf-prog').style.display='none'
    document.getElementById('pdf-result').style.display='block'
  } catch(e){
    document.getElementById('pdf-prog').style.display='none'
    document.getElementById('pdf-dz').style.display='flex'
    toast('PDF extraction failed: '+e.message.slice(0,60),'err')
  }
}

// -- TEXT CLEANUP -------------------------------------------
function cleanup(type){
  let text=document.getElementById('cleanup-in').value
  if(!text.trim()){toast('Paste text first','err');return}
  if(type==='trim'||type==='all') text=text.split('\n').map(l=>l.trim()).join('\n')
  if(type==='dedup'||type==='all'){const seen=new Set(); text=text.split('\n').filter(l=>{if(seen.has(l.trim())){return false}seen.add(l.trim());return true}).join('\n')}
  if(type==='normalize'||type==='all') text=text.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n')
  if(type==='remove-special'||type==='all') text=text.replace(/[^\w\s.,!?;:'"()\-\n]/g,' ').replace(/\s+/g,' ')
  if(type==='fix-newlines'||type==='all') text=text.replace(/([a-z,;])\n([a-z])/g,'$1 $2')
  if(type==='numbers') text=text.replace(/\b0\b(?=[a-zA-Z])/g,'O').replace(/\bl\b(?=\d)/g,'1')
  if(type==='markdown'||type==='all'){
    const lines=text.split('\n')
    text=lines.map(l=>{
      if(l.match(/^[A-Z][A-Z\s]+$/)&&l.length<80) return `## ${l}`
      if(l.match(/^\d+\.\s/)) return l
      return l
    }).join('\n')
  }
  document.getElementById('cleanup-out').value=text.trim()
  toast('Cleanup applied','ok')
}

// -- UTILS --------------------------------------------------
function copyResult(id){ navigator.clipboard.writeText(document.getElementById(id).value).then(()=>toast('Copied','ok')) }
function downloadTXT(id,name){ downloadText(document.getElementById(id).value, name+'.txt') }
function downloadMarkdown(id){ downloadText(document.getElementById(id).value, 'extracted.md') }
function downloadText(text, filename){ const a=document.createElement('a'); a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(text); a.download=filename; a.click() }
function showErr(id,msg){ const el=document.getElementById(id); el.textContent=msg; el.style.display='block' }
function toast(msg,type=''){
  const el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg
  document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(),2800)
}

<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>

(function(){

  var fileInput=document.querySelector('input[type="file"]');
  if(fileInput){
    fileInput.addEventListener('change',function(){
      var f=this.files[0];

  document.querySelectorAll('button').forEach(function(btn){

    if(t.includes('extract')||t.includes('recogni')||t.includes('start')||t.includes('ocr')||t.includes('scan')){

  });
